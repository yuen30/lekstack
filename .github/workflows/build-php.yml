name: Build Static PHP Binaries

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP Version to build (e.g., 8.3.16)'
        required: true
        type: string
      short_version:
        description: 'Short version for tagging (e.g., 8.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-static-php:
    name: Build Static PHP ${{ inputs.php_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP (for running SPC)
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          coverage: none

      - name: Checkout static-php-cli
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          path: static-php-cli

      - name: Install SPC dependencies
        run: |
          cd static-php-cli
          composer update --no-dev --classmap-authoritative
          chmod +x bin/spc
          bin/spc doctor --auto-fix

      - name: Download PHP Sources & Extensions
        run: |
          cd static-php-cli
          ./bin/spc download --with-php=${{ inputs.php_version }} --for-extensions="bcmath,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gettext,gmp,iconv,intl,ldap,mbstring,mbregex,mysqli,mysqlnd,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tidy,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib,opcache" --with-libs="gettext"

      - name: Build Static PHP
        run: |
          cd static-php-cli
          ./bin/spc build --build-cli --build-fpm --debug "bcmath,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gettext,gmp,iconv,intl,ldap,mbstring,mbregex,mysqli,mysqlnd,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tidy,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib,opcache"

      - name: Verify Build
        run: |
          echo "Verifying CLI binary..."
          ./static-php-cli/buildroot/bin/php -v
          ./static-php-cli/buildroot/bin/php -m
          
          echo "Verifying FPM binary..."
          ./static-php-cli/buildroot/bin/php-fpm -v

      - name: Prepare Archives
        run: |
          # Structure for LekStack
          mkdir -p dist/cli/bin
          mkdir -p dist/fpm/sbin
          mkdir -p dist/fpm/etc
          
          # Copy binaries
          cp static-php-cli/buildroot/bin/php dist/cli/bin/
          cp static-php-cli/buildroot/bin/php-fpm dist/fpm/sbin/
          
          # Create Archives
          echo "Creating CLI Archive..."
          cd dist/cli
          tar -czf ../../php-${{ inputs.php_version }}-cli-linux-x86_64.tar.gz .
          cd ../..
          
          echo "Creating FPM Archive..."
          cd dist/fpm
          tar -czf ../../php-${{ inputs.php_version }}-fpm-linux-x86_64.tar.gz .
          cd ../..
          
          echo "Creating Full Archive..."
          mkdir -p dist/full/bin
          mkdir -p dist/full/sbin
          cp static-php-cli/buildroot/bin/php dist/full/bin/
          cp static-php-cli/buildroot/bin/php-fpm dist/full/sbin/
          cd dist/full
          tar -czf ../../php-${{ inputs.php_version }}-full-linux-x86_64.tar.gz .
          cd ../..

      - name: Generate Checksums
        run: |
          sha256sum php-${{ inputs.php_version }}-*.tar.gz > checksums-${{ inputs.php_version }}.txt
          cat checksums-${{ inputs.php_version }}.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ inputs.php_version }}-static-binaries
          path: |
            php-${{ inputs.php_version }}-*.tar.gz
            checksums-${{ inputs.php_version }}.txt
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-${{ inputs.php_version }}
          name: PHP ${{ inputs.php_version }} (Static)
          body: |
            ## PHP ${{ inputs.php_version }} - Static Linux Binaries
            
            🚀 **Truly Portable**: Runs on any Linux distro (Alpine, Ubuntu, Fedora, Arch) without dependencies.
            
            Built with `static-php-cli` including:
            - ✅ **Core**: FPM, CLI, Opcache
            - ✅ **Database**: MySQL, PgSQL, SQLite, Redis
            - ✅ **Laravel Ready**: BCMath, Intl, Tidy, Zip, GD, Sodium, LDAP, XML, etc.
            
            ### Downloads
            
            - **CLI**: `php-${{ inputs.php_version }}-cli-linux-x86_64.tar.gz`
            - **FPM**: `php-${{ inputs.php_version }}-fpm-linux-x86_64.tar.gz`
            - **Full**: `php-${{ inputs.php_version }}-full-linux-x86_64.tar.gz`
            
            ---
            Built automatically by LekStack CI
          files: |
            php-${{ inputs.php_version }}-cli-linux-x86_64.tar.gz
            php-${{ inputs.php_version }}-fpm-linux-x86_64.tar.gz
            php-${{ inputs.php_version }}-full-linux-x86_64.tar.gz
            checksums-${{ inputs.php_version }}.txt
